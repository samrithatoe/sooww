<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i love you</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f113ba;
        }
        .wraper{
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #fdfdfd;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h2{
            font-size: 30px;
            color: #f113ba;
            margin: 15px;
        }
        .btn-group{
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: center;
        }
        button{
            position: absolute;
            width: 100px;
            height: inherit;
            font-size: 30px;
            background-color: white;
            border-radius: 30px;
            border-color: #f113ba;
            outline: none;
        }
        button:nth-child(2){
            margin-left: 200px;
            background-color: white;
            color: #070707;
        }
        button:nth-child(1){
            margin-right: 200px;
            background-color: #f113ba;
            color: white;
        }
    </style>
</head>
<body>
    <div class="wraper">
        <h2 class="question" align="center">I Love You :)<br>
        Do you Love me?</h2>
        <div class="btn-group">
            <button class="yes-btn">Yes</button>
            <button class="no-btn">No</button>
        </div>
    </div>
    <script>
        const wrapper = document.querySelector('.wraper');
        const question = document.querySelector('.question');
        const yesBtn = document.querySelector('.yes-btn');
        const noBtn = document.querySelector('.no-btn');

        const wrapperRect = wrapper.getBoundingClientRect();
        const noBtnRect = noBtn.getBoundingClientRect();

        yesBtn.addEventListener('click', () => {
            question.innerHTML = 'I love you too :)';
            });
            noBtn.addEventListener('mouseover', () => {
                const i = Math.floor(Math.random() * (wrapperRect.width - noBtnRect.width))
                +1;
                const j = Math.floor(Math.random() * (wrapperRect.width - noBtnRect.height))
                +1;
                noBtn.style.left = i + 'px';
                noBtn.style.top = j + 'px';
            });
    </script>
</body>
</html>
